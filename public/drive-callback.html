<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nightjar · Google Drive</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12110e; color: #efe8dc; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  p { max-width: 320px; }
</style>
</head>
<body>
<p id="msg">Connecting Google Drive to Nightjar…</p>
<script>
  // Google sends you back here with a one-time code. Hand it to Nightjar and close.
  (function () {
    var q = new URLSearchParams(location.search);
    var data = { type: "nightjar-drive", code: q.get("code"), state: q.get("state"), error: q.get("error"), t: Date.now() };
    try { localStorage.setItem("nightjar.driveConsent", JSON.stringify(data)); } catch (e) {}
    try { if (window.opener) window.opener.postMessage(data, location.origin); } catch (e) {}
    document.getElementById("msg").textContent = data.error
      ? "Google Drive wasn’t connected. You can close this and try again in Nightjar."
      : "Done. Google Drive stays connected. You can close this window.";
    setTimeout(function () { window.close(); }, 800);
  })();
</script>
</body>
</html>
